services:
  khronos:
    build: .
    image: khronos:jazzy
    # Host networking for DDS discovery + X11 forwarding.
    network_mode: host
    ipc: host
    environment:
      # X11 forwarding so RViz / hydra_visualizer render on the host display.
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/root/.Xauthority
      # Persistent HOME so model weights (CLIP + FastSAM) are cached on disk
      # and don't re-download (~1 GB) on every container start.
      - HOME=/root/ros2_ws/semantic_home
      # Ultralytics (FastSAM) config/weights cache location (persistent).
      - YOLO_CONFIG_DIR=/root/ros2_ws/semantic_home/.config/Ultralytics
      # GPU passthrough (NVIDIA) for RViz rendering and open-set segmentation.
      # CPU-only users: comment out 'gpus:' below and these two NVIDIA_* lines.
      # (It works with software rendering, but is not recommended / much slower.)
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    gpus: all
    volumes:
      # X11 socket + authority cookie for GUI apps (RViz) to render on the host.
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-${HOME}/.Xauthority}:/root/.Xauthority:ro
      # Working/build/data dirs live OUTSIDE this repo (under ~/khronos_data).
      # Bag files are never committed here; download/prepare them separately.
      - ${HOME}/khronos_data/ros2_ws:/root/ros2_ws
      - ${HOME}/khronos_data/bags:/data/bags:ro
      - ${HOME}/khronos_data/output:/root/output
      # Helper scripts (bind-mounted at runtime).
      - ./scripts:/root/scripts:ro
    working_dir: /root/ros2_ws
    stdin_open: true
    tty: true
