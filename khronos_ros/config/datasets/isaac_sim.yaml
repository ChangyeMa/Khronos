# Isaac Sim dataset (RGB-D + GT semantic labels).
type: RosInput
tf_verbosity: 1
clear_queue_on_fail: true
inputs:
  left_cam:
    receiver:
      type: ClosedSetImageReceiver
      input_separation_s: 0.04 # Limit input rate to max 25 Hz
    sensor:
      type: camera_info
      min_range: $(var sensor_min_range)
      max_range: $(var sensor_max_range)
      extrinsics:
        type: ros
        sensor_frame: camera
