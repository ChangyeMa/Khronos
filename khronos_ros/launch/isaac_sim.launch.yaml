---
launch:
  # ============ System ============
  # Images/TF/odom are stamped with SIM time, so run on sim time.
  - arg: {name: sim_time_required, default: 'true'}
  - arg: {name: evaluate, default: 'true'}
  - arg: {name: output_dir, default: '/root/output/isaac_sim'}
  - arg: {name: paused, default: 'false'}

  # Semantics: GT labels from the Isaac Sim bag (no semantic inference).
  - arg: {name: use_gt_semantics, default: 'true'}
  - arg: {name: use_openset_semantics, default: 'false'}
  # Pose: GT (camera pose published as /odom + world -> camera TF).
  - arg: {name: use_gt_frame, default: 'true'}

  # ============ Dataset ============
  - arg: {name: dataset, default: isaac_sim}
  - arg: {name: bag_dir, default: /data/bags}
  - arg: {name: play_rate, default: '1'}
  - arg: {name: bag_path, default: $(var bag_dir)/$(var dataset)}

  # ============ Configs ============
  - arg: {name: input_config, default: $(find-pkg-share khronos_ros)/config/datasets/isaac_sim.yaml}
  - arg: {name: mapper_config, default: $(find-pkg-share khronos_ros)/config/mapper/uHumans2.yaml}
  - arg: {name: rviz_path, default: $(find-pkg-share khronos_ros)/config/rviz/uHumans2.rviz}
  - arg: {name: labelspace_config, default: $(find-pkg-share khronos_ros)/config/label_spaces/isaac_sim_label_space.yaml}
  - arg: {name: semantic_colormap_config, default: ''}
  - let: {name: extra_yaml, value: '{semantic_colormap_file: $(var semantic_colormap_config)}'}

  # ============ Frames (Isaac Sim: the camera is both sensor and robot) ============
  - arg: {name: sensor_frame, default: camera}
  - arg: {name: robot_frame, default: camera}
  - arg: {name: odom_frame, default: world}
  - arg: {name: map_frame, default: world}
  - arg: {name: world_frame, default: world}

  # ============ Sensor range ============
  - arg: {name: sensor_min_range, default: '0.1'}
  - arg: {name: sensor_max_range, default: '30.0'}

  # ============ Input topics ============
  - arg: {name: rgb_topic, default: /isaac/rgb/image_raw}
  - arg: {name: rgb_info_topic, default: /isaac/camera_info}
  - arg: {name: depth_topic, default: /isaac/depth/image_raw}
  - arg: {name: label_topic, default: /isaac/semantic/image_raw}

  # ============ Set sim time ============
  - set_parameter:
      name: use_sim_time
      value: $(var sim_time_required)

  # ============ Play the bag (ianvs) ============
  - executable:
      cmd: sleep 8 && ros2 run ianvs play_rosbag $(var bag_path) -r $(var play_rate) --clock $(if $(var paused) --start-paused)
      name: dataset_player
      output: screen
      shell: true

  # ============ Static TFs (identity, world == map == odom) ============
  - node: {pkg: tf2_ros, exec: static_transform_publisher, name: map_to_odom_static_tf, args: --child-frame-id odom --frame-id map}
  - node: {pkg: tf2_ros, exec: static_transform_publisher, name: world_to_map_static_tf, args: --child-frame-id map --frame-id world}

  # ============ Launch Khronos ============
  - include:
      file: $(find-pkg-share khronos_ros)/launch/khronos.launch.yaml
      arg:
        - {name: input_config, value: $(var input_config)}
        - {name: mapper_config, value: $(var mapper_config)}
        - {name: rviz_path, value: $(var rviz_path)}
        - {name: labelspace_config, value: $(var labelspace_config)}
        - {name: extra_yaml, value: $(var extra_yaml)}
        - {name: output_dir, value: $(var output_dir)}
        - {name: evaluate, value: $(var evaluate)}
        - {name: sensor_min_range, value: $(var sensor_min_range)}
        - {name: sensor_max_range, value: $(var sensor_max_range)}
        - {name: sensor_frame, value: $(var sensor_frame)}
        - {name: robot_frame, value: $(var robot_frame)}
        - {name: odom_frame, value: $(var odom_frame)}
        - {name: map_frame, value: $(var map_frame)}
        - {name: world_frame, value: $(var world_frame)}
        - {name: use_gt_frame, value: $(var use_gt_frame)}
        - {name: rgb_topic, value: $(var rgb_topic)}
        - {name: rgb_info_topic, value: $(var rgb_info_topic)}
        - {name: depth_topic, value: $(var depth_topic)}
        - {name: label_topic, value: $(var label_topic)}
